name: Source and student-flow checks
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:repo
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:pwa
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Local-fixture-browser-evidence
          path: docs/audit/browser-results.json
