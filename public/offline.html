<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#18f4d6" />
    <title>KKCC — Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050605;
        --fg: #fff8e7;
        --primary: #18f4d6;
        --accent: #f5d78e;
        --muted: #c9d7ce;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(
            circle at 20% 0%,
            color-mix(in oklab, var(--primary) 24%, transparent),
            transparent 28rem
          ),
          linear-gradient(135deg, #050605, #07110f 60%, #030403);
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        width: min(100%, 480px);
        border: 1px solid color-mix(in oklab, var(--primary) 28%, transparent);
        border-radius: 28px;
        padding: 28px;
        background: color-mix(in oklab, #0d1411 90%, transparent);
        box-shadow: 0 20px 60px rgb(0 0 0 / 0.38);
      }
      img {
        height: 54px;
        width: auto;
        border-radius: 14px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.55rem;
        line-height: 1.12;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
      }
      a {
        margin-top: 20px;
        display: inline-flex;
        border-radius: 999px;
        background: var(--primary);
        color: #02110f;
        padding: 10px 16px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="KKCC logo" />
      <h1>You are offline</h1>
      <p>
        KKCC is ready to continue when your connection returns. Some recently opened pages and app
        files may still work from cache.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
