<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>KKCC Secure Video</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020617;
        color: white;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #020617;
      }
      .watermark {
        pointer-events: none;
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 48px;
        padding: 32px;
        opacity: 0.15;
      }
      .watermark span {
        align-self: center;
        justify-self: center;
        transform: rotate(-18deg);
        color: #a5f3fc;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .message {
        display: grid;
        min-height: 100%;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      .guard::after {
        content: "Protected KKCC secure video";
        position: fixed;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        background: rgba(2, 6, 23, 0.92);
        color: white;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-align: center;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root" class="message">
      <div>
        <h1>Loading secure video…</h1>
        <p>KKCC protected lecture player</p>
      </div>
    </div>
    <script>
      const PREFIX = "kkccv1.";
      function decodeToken(token) {
        if (!token || !token.startsWith(PREFIX)) return null;
        try {
          const raw = token.slice(PREFIX.length).replace(/-/g, "+").replace(/_/g, "/");
          const decoded = atob(raw.padEnd(raw.length + ((4 - (raw.length % 4)) % 4), "="));
          const parts = decoded.split("|");
          const id = (parts[1] || "").split("").reverse().join("");
          if (parts[0] !== "yt" || parts[2] !== "kkcc-secure-video" || !/^[\w-]{11}$/.test(id)) {
            return null;
          }
          return id;
        } catch (_) {
          return null;
        }
      }
      function prevent(event) {
        event.preventDefault();
      }
      function guard() {
        document.body.classList.add("guard");
        window.setTimeout(() => document.body.classList.remove("guard"), 1600);
      }
      document.addEventListener("contextmenu", prevent);
      document.addEventListener("copy", prevent);
      document.addEventListener("cut", prevent);
      document.addEventListener("dragstart", prevent);
      document.addEventListener("keydown", (event) => {
        const key = String(event.key || "").toLowerCase();
        if (
          key === "printscreen" ||
          ((event.ctrlKey || event.metaKey) && ["c", "x", "s", "p", "u"].includes(key))
        ) {
          event.preventDefault();
          guard();
        }
      });
      window.addEventListener("blur", guard);
      window.addEventListener("beforeprint", guard);

      const params = new URLSearchParams(location.search);
      const id = decodeToken(params.get("token"));
      const root = document.getElementById("root");
      if (!id) {
        root.innerHTML =
          "<div><h1>Video unavailable</h1><p>This secure video token is invalid.</p></div>";
      } else {
        const src = `https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1&controls=1&disablekb=1&iv_load_policy=3&playsinline=1`;
        root.className = "";
        root.innerHTML = `<iframe src="${src}" title="KKCC secure lecture video" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe><div class="watermark">${Array.from(
          { length: 12 },
        )
          .map(() => "<span>KKCC Secure Video</span>")
          .join("")}</div>`;
      }
    </script>
  </body>
</html>
